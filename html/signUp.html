  <div class="regmainContent" >
    <h1 id="h1Registrati">Registrati</h1> <br/>
    <div>Sei già registrato? Clicca <a href="../html/login.html" > qui</a> per accedere</div> <br/>
    <form action="../php/signUpDB.php" method="POST" id="information">
        <div id ="UserTypeDiv"> Scegli il tipo di profilo da Registrare <br/>           
            <label for="cliente"> Cliente </label>
            <input type="radio" id="cliente" name="UserType" value="cliente" checked onclick="NewUserIsBuilder();"> <br/>
            <label for="impresa"> Impresa</label>
            <input type="radio" id="impresa" name="UserType" value="impresa" onclick="NewUserIsBuilder();"> <br/> 
        </div>
         UserID <br/> <input type="text" class="UserInput" name="UserID" > <br/>
         Nome <br/> <input type="text" class="UserInput testoesteso" name="nome"> <br/>
         Cognome <br/> <input type="text" class="UserInput testoesteso" name="cognome"> <br/>
         email <br/> <input type="text" class="UserInput" name="email"> <br/>
         Password <br/> <input type="password" class="UserInput" id="pwd" name="pwd"> <br/>
         Conferma password <br/> <input type="password" class="UserInput" id="cpwd" name="cpwd" onblur="checkPasswordString()" > 
         <label id="errorPwd" style="display:none;">le password inserite differiscono</label> <br/>
         Data Di Nascita <br/> <input type="date" class="UserInput" id="birthDate" name="birthDate" onblur="checkBirthDate()"> 
         <label id="errorBirthDate" style="display:none;">Data di Nascita non accettabile</label> <br/>

         <label for="Regione">Regione</label>
         <select name="Regione" id="Regione" onclick = "emptyOptionsProvincia();">
             <option disabled selected value> -- Scegli la regione -- </option>
             <option value="Abruzzo">Abruzzo</option>
             <option value="Basilicata">Basilicata</option>
             <option value="Calabria">Calabria</option>
             <option value="Campania">Campania</option>
             <option value="Emilia Romagna">Emilia Romagna</option>
             <option value="Friuli Venezia Giulia">Friuli Venezia Giulia</option>
             <option value="Lazio">Lazio</option>
             <option value="Liguria">Liguria</option>
             <option value="Lombardia">Lombardia</option>
             <option value="Marche">Marche</option>
             <option value="Molise">Molise</option>
             <option value="Piemonte">Piemonte</option>
             <option value="Puglia">Puglia</option>
             <option value="Sardegna">Sardegna</option>
             <option value="Sicilia">Sicilia</option>
             <option value="Toscana">Toscana</option>
             <option value="Trentino Alto Adige">Trentino Alto Adige</option>
             <option value="Umbria">Umbria</option>
             <option value="Val D’Aosta">Val D’Aosta</option>
             <option value="Veneto">Veneto</option>
         </select> &nbsp; &nbsp; 
         <label for="Provincia">Provincia</label>
         <select name="Provincia" id="Provincia" onfocus="findProvincia('Regione');" >
             <option disabled selected value> -- Scegli la provincia -- </option>                    
         </select> <br/> <br/>
         <label for="Comune">Comune</label>
         <select name="Comune" id="Comune" onfocus="LoadComuni('Comune');" >
              <option disabled selected value> -- Scegli il comune -- </option>
         </select> <br/>
       <!-- Comune <br/> <input type="text" name="Comune" class="UserInput"> <br/> -->

         Indirizzo <br/> <input type="text" class="UserInput testoesteso" name="indirizzo"> <br/>
         Foto <br/> <input class="btn-secondario" type="file" id="UserPicture" name="foto" accept="image/png, image/jpeg" /> <br/> 

         
        

          <div name="Impresa" id="Impresa" style="display:none;">
           <p> Nome dell'Impresa <br/> <input type="text" class="UserInput testoesteso" name = "nomeImpresa"> </p>
            
                Descrizione <br/> <textarea type="textarea" class="UserInput" id="bio" name="bio"></textarea> <br/>
          </div> <br/> <br/>
          <input class="btn" type="submit" value="Submit">
    </form>

        
  </div>
